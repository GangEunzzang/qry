services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: qry_test
      POSTGRES_USER: qry_test
      POSTGRES_PASSWORD: qry_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qry_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: qry_test
      MYSQL_ROOT_PASSWORD: qry_test
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
